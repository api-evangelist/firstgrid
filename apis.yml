description: >-
  The domain firstgrid.cn resolves to Shanghai Shouige Network Technology Co.,
  Ltd. (上海首格网络科技有限公司 / "Shouige Network"), a Chinese software and
  logistics-services provider focused on the medical-device industry. Its
  products include the Medical Jiecloud Platform (医捷云), a bidirectional
  logistics intelligence and supply-chain management system, a public database
  platform, and third-party warehousing/distribution services for medical-device
  producers, distributors, and 3PLs, with offices in Shanghai and an R&D center
  in Hangzhou. The company was surfaced as a portfolio lead of the venture firm
  qiming and added to the API Evangelist network as a stub. As of this
  enrichment pass the public site is a Chinese-language corporate marketing site
  and exposes no public API, developer portal, OpenAPI, SDKs, or documentation
  surface, so no API artifacts could be harvested. Note: the recorded English
  name "firstgrid" is the pinyin of 首格 (Shǒugé) and the domain/company identity
  should be verified against the intended qiming portfolio company.
